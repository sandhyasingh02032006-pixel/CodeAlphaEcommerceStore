<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CodeAlpha Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 80px auto;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #e68900;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #ff9800;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="box">

            <h1>Login</h1>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <div id="message" class="message"></div>

            <div class="register">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </div>

        </div>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const message =
                        document
                            .getElementById("message");


                    try {

                        const response =
                            await fetch(
                                "/api/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({
                                        email: email,
                                        password: password
                                    })
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            message.style.color =
                                "red";

                            message.textContent =
                                data.message ||
                                "Login failed";

                            return;
                        }


                        // Save user in localStorage
                        localStorage.setItem(
                            "user",
                            JSON.stringify(data.user)
                        );


                        // Backup in sessionStorage
                        sessionStorage.setItem(
                            "user",
                            JSON.stringify(data.user)
                        );


                        message.style.color =
                            "green";

                        message.textContent =
                            "Login successful!";


                        // Redirect to products
                        setTimeout(
                            function() {

                                window.location.href =
                                    "products.html";

                            },
                            500
                        );

                    } catch (error) {

                        console.log(error);

                        message.style.color =
                            "red";

                        message.textContent =
                            "Server connection failed.";

                    }

                }
            );

    </script>

</body>

</html>
